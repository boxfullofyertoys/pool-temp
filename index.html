<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool Temperature</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .temperature-container {
            text-align: center;
            width: 100%;
            padding: 20px;
        }

        .temperature {
            font-size: 200px;
            color: #00FF00;
            font-weight: bold;
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .label {
            font-size: 48px;
            color: #FFFFFF;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .last-update {
            font-size: 20px;
            color: #666666;
            margin-top: 40px;
        }

        .error {
            color: #FF0000;
            font-size: 36px;
        }

        .loading {
            font-size: 48px;
            color: #666666;
        }
    </style>
</head>
<body>
    <div class="temperature-container">
        <div class="label">Pool Temperature</div>
        <div class="temperature" id="temp-display">
            <span class="loading">Loading...</span>
        </div>
        <div class="last-update" id="last-update"></div>
    </div>

    <script>
        const CONFIG = {
            // Replace this with your Cloudflare Worker URL after deploying
            workerUrl: 'https://wirelesstag-worker.david-8a2.workers.dev/
			
			
			
			
		
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			
			',
            refreshInterval: 60000,
            debug: true
        };

        function debugLog(message, data = null) {
            if (CONFIG.debug) {
                console.log(`[DEBUG] ${message}`, data || '');
            }
        }

        async function getTemperature() {
            try {
                if (CONFIG.workerUrl.includes('YOUR-WORKER-NAME')) {
                    throw new Error('Please update workerUrl with your Cloudflare Worker URL');
                }

                debugLog('Fetching temperature from worker...');
                
                const response = await fetch(CONFIG.workerUrl);
                debugLog('Response status:', response.status);

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP ${response.status}`);
                }

                const data = await response.json();
                debugLog('Data received:', data);

                if (data.temperature_f) {
                    const tempF = data.temperature_f;
                    
                    debugLog(`Temperature: ${tempF}°F`);
                    
                    document.getElementById('temp-display').innerHTML = `${tempF.toFixed(1)}°F`;
                    
                    const lastUpdate = new Date(data.last_update * 1000);
                    document.getElementById('last-update').textContent = 
                        `Last updated: ${lastUpdate.toLocaleString()}`;
                    
                    debugLog('Display updated successfully');
                } else {
                    throw new Error('Invalid data format received');
                }

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('temp-display').innerHTML = 
                    `<span class="error">Error: ${error.message}</span>`;
                document.getElementById('last-update').textContent = 
                    'Check console (F12) for details';
            }
        }

        debugLog('Initializing pool temperature display...');
        getTemperature();
        setInterval(getTemperature, CONFIG.refreshInterval);
    </script>
</body>
</html>

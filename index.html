<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool Temperature</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .temperature-container {
            text-align: center;
            width: 100%;
            padding: 20px;
        }

        .temperature {
            font-size: 200px;
            color: #00FF00;
            font-weight: bold;
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .label {
            font-size: 48px;
            color: #FFFFFF;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .last-update {
            font-size: 20px;
            color: #666666;
            margin-top: 40px;
        }

        .error {
            color: #FF0000;
            font-size: 36px;
        }

        .loading {
            font-size: 48px;
            color: #666666;
        }
    </style>
</head>
<body>
    <div class="temperature-container">
        <div class="label">Pool Temperature</div>
        <div class="temperature" id="temp-display">
            <span class="loading">Loading...</span>
        </div>
        <div class="last-update" id="last-update"></div>
    </div>

    <script>
        const CONFIG = {
            sharedUUID: 'e44e3a48-0b42-42ed-ac28-b3b96d378837',
            sensorIndex: 0,
            refreshInterval: 60000,
            corsProxy: 'https://corsproxy.io/?',
            debug: true
        };

        function debugLog(message, data = null) {
            if (CONFIG.debug) {
                console.log(`[DEBUG] ${message}`, data || '');
            }
        }

        async function getTemperature() {
            try {
                debugLog('Fetching temperature data...');
                debugLog('Using shared UUID:', CONFIG.sharedUUID);
                
                const apiUrl = `https://my.wirelesstag.net/eth/st.asmx/GetStatsRaw?uuid=${CONFIG.sharedUUID}`;
                const url = `${CONFIG.corsProxy}${encodeURIComponent(apiUrl)}`;
                
                debugLog('Full request URL:', url);
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': '*/*'
                    }
                });
                debugLog('Response status:', response.status);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: Check UUID and sharing settings`);
                }

                const text = await response.text();
                debugLog('Response received, length:', text.length);
                
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(text, "text/xml");
                
                const jsonString = xmlDoc.querySelector('string')?.textContent;
                
                if (!jsonString) {
                    debugLog('Raw response:', text.substring(0, 500));
                    throw new Error('Could not extract data. Check console for raw response.');
                }
                
                const data = JSON.parse(jsonString);
                debugLog('Data parsed successfully. Sensors found:', data.length);
                
                if (data && data.length > 0) {
                    const sensor = data[CONFIG.sensorIndex];
                    
                    if (sensor) {
                        debugLog('Sensor data:', sensor);
                        
                        const tempC = sensor.temp;
                        const tempF = (tempC * 9/5) + 32;
                        
                        debugLog(`Temperature: ${tempC}°C = ${tempF.toFixed(1)}°F`);
                        
                        document.getElementById('temp-display').innerHTML = `${tempF.toFixed(1)}°F`;
                        
                        const lastUpdate = new Date(sensor.time * 1000);
                        document.getElementById('last-update').textContent = 
                            `Last updated: ${lastUpdate.toLocaleString()}`;
                            
                        debugLog('Display updated successfully');
                    } else {
                        throw new Error(`Sensor ${CONFIG.sensorIndex} not found`);
                    }
                } else {
                    throw new Error('No sensor data found');
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('temp-display').innerHTML = 
                    `<span class="error">Error: ${error.message}</span>`;
                document.getElementById('last-update').textContent = 
                    'Check console (F12) for details';
            }
        }

        debugLog('Initializing...');
        getTemperature();
        setInterval(getTemperature, CONFIG.refreshInterval);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool Temperature</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .temperature-container {
            text-align: center;
            width: 100%;
            padding: 20px;
        }

        .temperature {
            font-size: 200px;
            color: #00FF00;
            font-weight: bold;
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .label {
            font-size: 48px;
            color: #FFFFFF;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .last-update {
            font-size: 20px;
            color: #666666;
            margin-top: 40px;
        }

        .error {
            color: #FF0000;
            font-size: 36px;
        }

        .loading {
            font-size: 48px;
            color: #666666;
        }
    </style>
</head>
<body>
    <div class="temperature-container">
        <div class="label">Pool Temperature</div>
        <div class="temperature" id="temp-display">
            <span class="loading">Loading...</span>
        </div>
        <div class="last-update" id="last-update"></div>
    </div>

    <script>
        const CONFIG = {
            uuid: 'e44e3a48-0b42-42ed-ac28-b3b96d378837',
            sensorName: 'Pool%20Temperature',  // URL encoded sensor name from your CSV link
            refreshInterval: 60000,
            corsProxy: 'https://corsproxy.io/?',
            debug: true
        };

        function debugLog(message, data = null) {
            if (CONFIG.debug) {
                console.log(`[DEBUG] ${message}`, data || '');
            }
        }

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            if (lines.length < 2) return null;
            
            const headers = lines[0].split(',');
            const values = lines[lines.length - 1].split(','); // Get most recent reading (last line)
            
            const data = {};
            headers.forEach((header, index) => {
                data[header.trim()] = values[index] ? values[index].trim() : null;
            });
            
            return data;
        }

        async function getTemperature() {
            try {
                debugLog('Fetching temperature data from CSV...');
                
                // Use the CSV download link from WirelessTag
                const csvUrl = `https://my.wirelesstag.net/ethDownloadTempCSV.aspx?uuid=${CONFIG.uuid}&name=${CONFIG.sensorName}`;
                const url = `${CONFIG.corsProxy}${encodeURIComponent(csvUrl)}`;
                
                debugLog('Request URL:', url);
                
                const response = await fetch(url);
                debugLog('Response status:', response.status);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: Failed to fetch CSV data`);
                }

                const csvText = await response.text();
                debugLog('CSV data received, length:', csvText.length);
                debugLog('First 200 chars:', csvText.substring(0, 200));
                
                const data = parseCSV(csvText);
                
                if (!data) {
                    throw new Error('Could not parse CSV data');
                }
                
                debugLog('Parsed data:', data);
                
                // CSV typically has "Temperature" or "Temp" column
                let tempF = null;
                
                // Try different possible column names
                if (data['Temperature']) {
                    tempF = parseFloat(data['Temperature']);
                } else if (data['Temp']) {
                    tempF = parseFloat(data['Temp']);
                } else if (data['Value']) {
                    tempF = parseFloat(data['Value']);
                } else {
                    // Try to find any column that looks like temperature
                    for (let key in data) {
                        if (key.toLowerCase().includes('temp')) {
                            tempF = parseFloat(data[key]);
                            break;
                        }
                    }
                }
                
                if (tempF === null || isNaN(tempF)) {
                    debugLog('Available columns:', Object.keys(data));
                    throw new Error('Could not find temperature value in CSV. Check console for available columns.');
                }
                
                debugLog(`Temperature: ${tempF}°F`);
                
                document.getElementById('temp-display').innerHTML = `${tempF.toFixed(1)}°F`;
                
                // Try to get timestamp
                let timestamp = data['Date'] || data['Time'] || data['DateTime'] || data['Timestamp'];
                if (timestamp) {
                    document.getElementById('last-update').textContent = 
                        `Last updated: ${timestamp}`;
                } else {
                    document.getElementById('last-update').textContent = 
                        `Last updated: ${new Date().toLocaleString()}`;
                }
                
                debugLog('Display updated successfully');
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('temp-display').innerHTML = 
                    `<span class="error">Error: ${error.message}</span>`;
                document.getElementById('last-update').textContent = 
                    'Check console (F12) for details';
            }
        }

        debugLog('Initializing pool temperature display...');
        getTemperature();
        setInterval(getTemperature, CONFIG.refreshInterval);
    </script>
</body>
</html>

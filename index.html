<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool Temperature</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* ===== CUSTOMIZATION SECTION - EDIT THESE VALUES ===== */
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #355e3b;    /* Background color */
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 100%;
            padding: 40px;
        }

        .label {
            font-size: 48px;              /* Title size */
            color: #FFFFFF;               /* Title color - now white */
            margin-top: 20px;             /* Space above title (moved below temp) */
            font-weight: normal;
            letter-spacing: 2px;
        }

        .temperature {
            font-size: 150px;             /* Temperature size - CUSTOMIZE THIS */
            color: #FFFFFF;               /* Temperature color - now white */
            font-weight: normal;
            margin: 20px 0;
            line-height: 1;
            /* text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);  /* White glow effect */
        }

        .info {
            font-size: 24px;              /* Info text size */
            color: #FFFFFF;               /* Info text color - now white */
            margin-top: 30px;
        }

        .battery {
            font-size: 18px;
            color: #FFFFFF;               /* Battery color - now white */
            margin-top: 15px;
        }

        .error {
            color: #FF0000;
            font-size: 32px;
        }

        .loading {
            font-size: 48px;
            color: #FFFFFF;               /* Loading text - now white */
        }

        /* ===== END CUSTOMIZATION SECTION ===== */
    </style>
</head>
<body>
    <div class="container">
        <div class="temperature" id="temp-display">
            <span class="loading">Loading...</span>
        </div>
        <div class="label">Pool Temperature</div>
    </div>

    <script>
        // ===== CONFIGURE YOUR WORKER URL HERE =====
        const WORKER_URL = 'https://wirelesstag-worker.david-8a2.workers.dev/';
        // ==========================================

        const CONFIG = {
            refreshInterval: 60000,  // Refresh every 60 seconds
            debug: true
        };

        function debugLog(message, data = null) {
            if (CONFIG.debug) {
                console.log(`[DEBUG] ${message}`, data || '');
            }
        }

        async function updateTemperature() {
            try {
                if (WORKER_URL.includes('YOUR-WORKER-NAME')) {
                    throw new Error('Please update WORKER_URL with your Cloudflare Worker URL');
                }

                debugLog('Fetching temperature...');
                
                const response = await fetch(WORKER_URL);
                debugLog('Response status:', response.status);

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP ${response.status}`);
                }

                const data = await response.json();
                debugLog('Data received:', data);

                // Update temperature display
                document.getElementById('temp-display').textContent = `${data.temperature_f.toFixed(1)}°`;

                debugLog('Display updated successfully');

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('temp-display').innerHTML = 
                    `<span class="error">Error: ${error.message}</span>`;
            }
        }

        // Initial load
        debugLog('Initializing...');
        updateTemperature();
        
        // Auto-refresh
        setInterval(updateTemperature, CONFIG.refreshInterval);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool Temperature</title>
    <style>
        /* ===== CUSTOMIZATION SECTION - EDIT THESE VALUES ===== */
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000000;    /* Background color */
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 100%;
            padding: 40px;
        }

        .label {
            font-size: 48px;              /* Title size */
            color: #FFFFFF;               /* Title color */
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .temperature {
            font-size: 200px;             /* Temperature size - CUSTOMIZE THIS */
            color: #00FF00;               /* Temperature color - CUSTOMIZE THIS */
            font-weight: bold;
            margin: 20px 0;
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.5);  /* Glow effect */
        }

        .info {
            font-size: 24px;              /* Info text size */
            color: #888888;               /* Info text color */
            margin-top: 30px;
        }

        .battery {
            font-size: 18px;
            color: #666666;
            margin-top: 15px;
        }

        .error {
            color: #FF0000;
            font-size: 32px;
        }

        .loading {
            font-size: 48px;
            color: #666666;
        }

        /* ===== END CUSTOMIZATION SECTION ===== */
    </style>
</head>
<body>
    <div class="container">
        <div class="label">Pool Temperature</div>
        <div class="temperature" id="temp-display">
            <span class="loading">Loading...</span>
        </div>
    </div>

    <script>
        // ===== CONFIGURE YOUR WORKER URL HERE =====
        const WORKER_URL = 'https://YOUR-WORKER-NAME.YOUR-USERNAME.workers.dev';
        // ==========================================

        const CONFIG = {
            refreshInterval: 60000,  // Refresh every 60 seconds
            debug: true
        };

        function debugLog(message, data = null) {
            if (CONFIG.debug) {
                console.log(`[DEBUG] ${message}`, data || '');
            }
        }

        async function updateTemperature() {
            try {
                if (WORKER_URL.includes('YOUR-WORKER-NAME')) {
                    throw new Error('Please update WORKER_URL with your Cloudflare Worker URL');
                }

                debugLog('Fetching temperature...');
                
                const response = await fetch(WORKER_URL);
                debugLog('Response status:', response.status);

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP ${response.status}`);
                }

                const data = await response.json();
                debugLog('Data received:', data);

                // Update temperature display
                document.getElementById('temp-display').textContent = `${data.temperature_f.toFixed(1)}°F`;

                debugLog('Display updated successfully');

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('temp-display').innerHTML = 
                    `<span class="error">Error: ${error.message}</span>`;
            }
        }

        // Initial load
        debugLog('Initializing...');
        updateTemperature();
        
        // Auto-refresh
        setInterval(updateTemperature, CONFIG.refreshInterval);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool Temperature</title>
    <style>
        /* ===== CUSTOMIZATION SECTION - EDIT THESE VALUES ===== */
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000000;    /* Background color - change as needed */
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;             /* Maximum width of the display */
            padding: 40px;                /* Spacing around the content */
            text-align: center;
        }

        .label {
            font-size: 48px;              /* Title text size */
            color: #FFFFFF;               /* Title text color */
            margin-bottom: 30px;          /* Space below title */
            font-weight: 300;
            text-transform: uppercase;    /* Makes text UPPERCASE - remove this line for normal case */
            letter-spacing: 2px;          /* Space between letters */
        }

        .iframe-wrapper {
            background-color: transparent; /* Background behind the iframe */
            border-radius: 10px;          /* Rounded corners */
            padding: 20px;                /* Space around iframe */
            box-shadow: none;             /* Shadow effect - change to '0 4px 20px rgba(255,255,255,0.1)' for a glow */
        }

        iframe {
            border: none;
            width: 100%;
            height: 80px;                 /* Height of the iframe - adjust if content is cut off */
            display: block;
            margin: 0 auto;
        }

        /* Optional: Scale up the iframe content */
        .iframe-wrapper.scaled iframe {
            transform: scale(2);          /* Makes content 2x bigger - adjust as needed */
            transform-origin: center;
            height: 160px;                /* Adjust based on scale factor */
        }

        /* ===== END CUSTOMIZATION SECTION ===== */
    </style>
</head>
<body>
    <div class="container">
        <div class="label">Pool Temperature</div>
        
        <!-- Add 'scaled' class to the div below to make iframe content bigger -->
        <div class="iframe-wrapper">
            <iframe src="https://my.wirelesstag.net/ethSharedFrame.aspx?pic=1&hide_name=0&hide_temp=0&hide_rh=0&hide_lux=1&hide_updated=0&hide_signal=1&hide_battery=1&hide_battery_volt=0&hide_motion=1&uuids=e44e3a48-0b42-42ed-ac28-b3b96d378837" 
                    scrolling="no"></iframe>
        </div>
    </div>

    <script>
        // Auto-refresh the iframe every 60 seconds to get updated temperature
        setInterval(function() {
            const iframe = document.querySelector('iframe');
            iframe.src = iframe.src;
        }, 60000);
    </script>
</body>
</html>
